{% load static %}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT 设备管理平台</title>
<link rel="stylesheet" href="{% static 'console.css' %}">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="card">
    <h2>IoT 设备管理平台</h2>
    <label>用户名<input name="username" value="admin" required></label>
    <label>密码<input name="password" type="password" required></label>
    <button class="primary">登录</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <strong>IoT 设备管理平台</strong>
    <nav id="tabs">
      <a data-tab="devices" class="active">设备在线管理</a>
      <a data-tab="commands">设备控制</a>
      <a data-tab="batches">批量控制</a>
      <a data-tab="versions">版本与升级包</a>
      <a data-tab="tasks">升级任务</a>
      <a data-tab="audit">操作审计</a>
    </nav>
    <span class="right"><span id="wsState" class="dot off"></span><span id="who"></span> <a id="logout">退出</a></span>
  </header>

  <main>
    <!-- 设备 -->
    <section id="tab-devices">
      <div class="stats" id="deviceStats"></div>
      <form class="filters" id="deviceFilter">
        <input name="search" placeholder="编号 / 名称">
        <select name="online_status"><option value="">全部状态</option><option>ONLINE</option><option>OFFLINE</option></select>
        <input name="model" placeholder="型号">
        <select name="group_id" class="groupSelect"><option value="">全部分组</option></select>
        <input name="version" placeholder="版本">
        <label>上线自<input type="datetime-local" name="last_online_after"></label>
        <label>至<input type="datetime-local" name="last_online_before"></label>
        <button>查询</button>
        <button type="button" id="exportDevices">导出 CSV</button>
        <button type="button" id="newDevice" class="primary">新增设备</button>
      </form>
      <table id="deviceTable"></table>
      <div class="pager" id="devicePager"></div>
    </section>

    <!-- 单设备控制 -->
    <section id="tab-commands" class="hidden">
      <form class="card inline" id="cmdForm">
        <label>设备<input name="device_id" required placeholder="dev-001"></label>
        <label>指令<select name="template_id" class="tplSelect" required></select></label>
        <label>参数(JSON)<input name="params" value="{}"></label>
        <label>离线策略<select name="offline_policy"><option value="REJECT">拒绝</option><option value="QUEUE">排队</option></select></label>
        <button class="primary">下发</button>
      </form>
      <form class="filters" id="cmdFilter">
        <input name="device_id" placeholder="设备">
        <select name="status"><option value="">全部状态</option><option>PENDING</option><option>SENT</option><option>DELIVERED</option><option>SUCCESS</option><option>FAILED</option><option>TIMEOUT</option></select>
        <select name="is_critical"><option value="">全部</option><option value="true">仅关键操作</option></select>
        <button>查询</button>
      </form>
      <table id="cmdTable"></table>
      <div class="pager" id="cmdPager"></div>
    </section>

    <!-- 批量控制 -->
    <section id="tab-batches" class="hidden">
      <form class="card inline" id="batchForm">
        <label>指令<select name="template_id" class="tplSelect" required></select></label>
        <label>参数(JSON)<input name="params" value="{}"></label>
        <label>范围<select name="scope_type"><option value="device_ids">设备列表</option><option value="group_id">分组</option><option value="filters">筛选条件(JSON)</option><option value="all">全部设备</option></select></label>
        <label>范围值<input name="scope_value" placeholder="dev-001,dev-002 / 分组ID / {&quot;model&quot;:&quot;GW-100&quot;}"></label>
        <label>离线<select name="offline_policy"><option value="REJECT">标记失败</option><option value="QUEUE">排队</option></select></label>
        <label>并发<input name="concurrency" type="number" value="20" min="1"></label>
        <button class="primary">创建批次</button>
      </form>
      <table id="batchTable"></table>
      <div class="pager" id="batchPager"></div>
    </section>

    <!-- 版本 -->
    <section id="tab-versions" class="hidden">
      <form class="card inline" id="versionForm">
        <label>版本号<input name="version_no" required placeholder="1.2.0"></label>
        <label>适用型号<input name="applicable_models" required placeholder="GW-100,CAM-1"></label>
        <label>最低可升级<input name="min_upgradable_version" placeholder="1.0.0"></label>
        <label class="grow">更新说明<input name="release_notes"></label>
        <button class="primary">新建版本</button>
      </form>
      <form class="card inline" id="packageForm">
        <label>版本<select name="version_id" class="versionSelect" required></select></label>
        <label>类型<select name="package_type"><option>FULL</option><option>DIFF</option></select></label>
        <label>差分起始版本<input name="base_version"></label>
        <label>文件<input type="file" name="file" required></label>
        <button class="primary">上传升级包</button>
      </form>
      <table id="versionTable"></table>
    </section>

    <!-- 升级任务 -->
    <section id="tab-tasks" class="hidden">
      <form class="card inline" id="taskForm">
        <label>目标版本<select name="version_id" class="releasableSelect" required></select></label>
        <label>范围<select name="scope_type"><option value="all">全部设备</option><option value="device_ids">设备列表</option><option value="group_id">分组</option><option value="filters">筛选条件(JSON)</option></select></label>
        <label>范围值<input name="scope_value"></label>
        <label>灰度比例<input name="gray_ratio" type="number" step="0.01" min="0.01" max="1" value="0.1"></label>
        <label>灰度设备<input name="gray_device_ids" placeholder="可选，逗号分隔"></label>
        <label>失败率阈值<input name="failure_threshold" type="number" step="0.01" min="0" max="1" value="0.2"></label>
        <button class="primary">创建任务</button>
      </form>
      <table id="taskTable"></table>
      <div class="pager" id="taskPager"></div>
      <div id="taskDetail" class="card hidden"></div>
    </section>

    <!-- 审计 -->
    <section id="tab-audit" class="hidden">
      <form class="filters" id="auditFilter">
        <input name="operator_id" placeholder="操作人">
        <select name="op_type" id="opTypeSelect"><option value="">全部类型</option></select>
        <input name="target_id" placeholder="对象">
        <button>查询</button>
        <button type="button" id="exportAudit">导出 CSV</button>
      </form>
      <table id="auditTable"></table>
      <div class="pager" id="auditPager"></div>
    </section>
  </main>
</div>

<dialog id="modal"><div id="modalBody"></div><form method="dialog"><button>关闭</button></form></dialog>
<div id="toast"></div>
<script src="{% static 'console.js' %}"></script>
</body>
</html>
